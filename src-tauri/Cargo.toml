[package]
name = "boss-turns"
version = "0.2.0"
description = "BOSS TURNS — Patron Dönüyor! (masaüstü sürümü)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
