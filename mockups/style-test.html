<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSS TURNS — görsel yön denemesi</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1018; overflow: hidden; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Görsel yön denemesi: aynı sahne 3 stilde. ?style=vector | cartoon | pixel
// Bu dosya oyun değil; yalnızca karar vermek için statik bir kare.
const W = 1920, H = 1080;
const STYLE_NAME = new URLSearchParams(location.search).get('style') || 'vector';
const STYLES = {
  vector:  { outline: 0, pixel: 1, shade: 1 },
  cartoon: { outline: 7, pixel: 1, shade: 0.6 },
  pixel:   { outline: 0, pixel: 4, shade: 1 },
};
const S = STYLES[STYLE_NAME] || STYLES.vector;
const INK = '#1b1f2e';
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

const out = document.getElementById('c');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  out.style.width = W * s + 'px'; out.style.height = H * s + 'px';
}
out.width = W; out.height = H; fit(); addEventListener('resize', fit);
const octx = out.getContext('2d');

// sahne tuvali (pixel stilinde düşük çözünürlük)
const sc = document.createElement('canvas');
sc.width = W / S.pixel; sc.height = H / S.pixel;
let ctx = sc.getContext('2d');
ctx.scale(1 / S.pixel, 1 / S.pixel);

/* ---------- yardımcılar ---------- */
function path(fn) { ctx.beginPath(); fn(); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillShape(build, fill, opts = {}) {
  ctx.beginPath(); build(); ctx.fillStyle = fill; ctx.fill();
  if (S.outline && opts.outline !== false) {
    ctx.lineWidth = (opts.ow || 1) * S.outline / (opts.scale || 1); ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
  }
}
const R = (x, y, w, h, r = 0) => () => rr(x, y, w, h, r);
const C = (x, y, r) => () => ctx.arc(x, y, r, 0, Math.PI * 2);
const E = (x, y, rx, ry, rot = 0) => () => ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
function lg(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rg(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
// gölge tarafı: şekli kırp ve sağ tarafı koyulaştır
function shadeRight(build, fromX, alpha = 0.16) {
  if (!S.shade) return;
  ctx.save(); ctx.beginPath(); build(); ctx.clip();
  ctx.fillStyle = `rgba(20,16,40,${alpha * S.shade})`; ctx.fillRect(fromX, -5000, 10000, 10000);
  ctx.restore();
}

/* ---------- arka duvar / koridor ---------- */
function drawBack() {
  ctx.fillStyle = lg(0, 0, 0, 730, [[0, '#f1e3cf'], [1, '#e2cdb3']]); ctx.fillRect(0, 0, W, 740);
  // lambri
  ctx.fillStyle = '#d6bf9f'; ctx.fillRect(0, 560, W, 150);
  ctx.fillStyle = '#c3a985'; ctx.fillRect(0, 556, W, 8);
  for (let x = 30; x < W; x += 160) { fillShape(R(x, 590, 130, 96, 6), 'rgba(255,255,255,.12)', { outline: false }); }

  // pencereler
  const wins = [[60, 110], [290, 110]];
  for (const [wx, wy] of wins) {
    fillShape(R(wx - 14, wy - 14, 208, 438, 10), '#fbf6ee');
    ctx.save(); ctx.beginPath(); rr(wx, wy, 180, 410, 4); ctx.clip();
    ctx.fillStyle = lg(0, wy, 0, wy + 410, [[0, '#7fb4e6'], [0.55, '#f7c59f'], [1, '#f49d7a']]); ctx.fillRect(wx, wy, 180, 410);
    // güneş
    ctx.fillStyle = rg(260, 330, 10, 140, [[0, 'rgba(255,240,200,.95)'], [0.3, 'rgba(255,214,150,.6)'], [1, 'rgba(255,214,150,0)']]);
    ctx.fillRect(wx, wy, 180, 410);
    // bulut
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for (const [cx, cy, s] of [[wx + 40, wy + 70, 1], [wx + 130, wy + 120, 0.7]]) { ctx.beginPath(); ctx.ellipse(cx, cy, 42 * s, 13 * s, 0, 0, 7); ctx.ellipse(cx + 20 * s, cy - 10 * s, 26 * s, 14 * s, 0, 0, 7); ctx.fill(); }
    // şehir
    const bl = [[0, 190, '#7d6f9a'], [36, 250, '#6c5f8a'], [70, 150, '#887aa5'], [104, 290, '#5e537c'], [140, 210, '#74679a']];
    for (const [bx, bh, col] of bl) {
      ctx.fillStyle = col; ctx.fillRect(wx + bx, wy + 410 - bh, 38, bh);
      ctx.fillStyle = 'rgba(255,220,150,.55)';
      for (let yy = wy + 410 - bh + 14; yy < wy + 400; yy += 22) for (let xx = 6; xx < 32; xx += 12) if ((xx * 7 + yy) % 5 < 2) ctx.fillRect(wx + bx + xx, yy, 6, 9);
    }
    ctx.restore();
    ctx.fillStyle = '#fbf6ee'; ctx.fillRect(wx + 86, wy, 8, 410); ctx.fillRect(wx, wy + 200, 180, 8);
  }

  // poster
  fillShape(R(650, 170, 190, 150, 8), '#fffdf8');
  ctx.strokeStyle = '#ff6b5e'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(675, 285); ctx.lineTo(715, 260); ctx.lineTo(750, 272); ctx.lineTo(810, 200); ctx.stroke();
  ctx.fillStyle = '#ff6b5e'; ctx.beginPath(); ctx.moveTo(815, 192); ctx.lineTo(795, 200); ctx.lineTo(812, 214); ctx.fill();
  ctx.font = `900 20px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.fillText('HEDEF %110', 745, 308);

  // saat
  fillShape(C(1250, 190, 62), '#fffdf8', { ow: 1.2 });
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(1250, 190, 62, 0, 7); ctx.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(1250 + Math.cos(a) * 48, 190 + Math.sin(a) * 48, i % 3 ? 2.5 : 4.5, 0, 7); ctx.fill(); }
  ctx.lineCap = 'round'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(1250, 190); ctx.lineTo(1250 + 26, 190 + 8); ctx.stroke();
  ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(1250, 190); ctx.lineTo(1250 - 6, 190 - 44); ctx.stroke();
  ctx.fillStyle = '#ff6b5e'; ctx.beginPath(); ctx.arc(1250, 190, 6, 0, 7); ctx.fill();

  // toplantı odası kapısı
  fillShape(R(1390, 250, 190, 460, 8), '#a8714a');
  ctx.fillStyle = '#93603c'; ctx.fillRect(1412, 280, 146, 170); ctx.fillRect(1412, 476, 146, 210);
  fillShape(C(1550, 480, 10), '#ffc94d');
  fillShape(R(1395, 205, 180, 34, 8), '#2d3448');
  ctx.font = `800 17px ${FONT}`; ctx.fillStyle = '#ffc94d'; ctx.fillText('TOPLANTI ● DOLU', 1485, 228);

  // su sebili + kahve makinesi
  fillShape(R(1660, 470, 96, 240, 12), '#dfe7f1');
  fillShape(R(1672, 360, 72, 112, 26), 'rgba(120,190,240,.85)');
  fillShape(R(1690, 520, 36, 16, 4), '#5c7a9c');
  fillShape(R(1790, 520, 110, 190, 10), '#3a4054');
  fillShape(R(1806, 540, 78, 50, 8), '#1f2433');
  ctx.fillStyle = '#4fd1a5'; ctx.fillRect(1816, 552, 24, 6);

  // koridor bitkisi
  fillShape(R(960 - 380, 600, 76, 104, 10), '#d96c5f');
  for (let i = 0; i < 7; i++) {
    ctx.save(); ctx.translate(618, 604); ctx.rotate(-Math.PI / 2 + (i - 3) * 0.32);
    fillShape(E(62, 0, 64, 18), i % 2 ? '#3f9d6e' : '#4fb37f'); ctx.restore();
  }
  ctx.fillStyle = '#cdb898'; ctx.fillRect(0, 700, W, 34);
}

/* ---------- patron (birim koordinat: ayak = 0) ---------- */
function drawBoss(x, feet, k, turn) {
  const suit = '#3a5a8c', tie = '#ff6b5e', hair = '#3a2a22', skin = '#f2c6a0', pants = '#263c63';
  ctx.save(); ctx.translate(x, feet); ctx.scale(k, k);
  const o = { scale: k };
  ctx.fillStyle = 'rgba(20,10,0,.22)'; ctx.beginPath(); ctx.ellipse(0, 0, 40, 7, 0, 0, 7); ctx.fill();
  fillShape(R(-18, -68, 16, 66, 6), pants, o); fillShape(R(3, -68, 16, 66, 6), pants, o);
  fillShape(E(-10, -3, 13, 5.5), '#1f1f26', o); fillShape(E(12, -3, 13, 5.5), '#1f1f26', o);
  // gövde
  const torso = R(-36, -142, 72, 82, 18);
  fillShape(torso, suit, o); shadeRight(torso, 8, 0.2);
  // arka: dikiş + yaka
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -120); ctx.lineTo(0, -62); ctx.stroke();
  fillShape(R(-14, -146, 28, 9, 4), '#4a6ea6', o);
  // kollar
  fillShape(R(-47, -136, 14, 62, 7), '#33507f', o); fillShape(R(33, -136, 14, 62, 7), '#2c466f', o);
  fillShape(C(-40, -72, 7), skin, o); fillShape(C(40, -72, 7), skin, o);
  // kafa
  ctx.fillStyle = '#d9a983'; ctx.fillRect(-8, -156, 16, 14);
  const hy = -176, hr = 25;
  fillShape(C(-hr + 2, hy + 3, 6), skin, o); fillShape(C(hr - 2, hy + 3, 6), skin, o);
  const head = C(0, hy, hr);
  fillShape(head, skin, o); shadeRight(head, 8, 0.12);
  // yüz (dönüş)
  const fa = Math.max(0, Math.min(1, (turn - 0.12) / 0.45));
  if (fa > 0) {
    const fx = (1 - turn) * hr * 0.95, sq = 0.35 + 0.65 * turn;
    ctx.save(); ctx.globalAlpha = fa;
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(fx - 9 * sq, hy - 2, 2.8 * sq + 0.7, 3.4, 0, 0, 7); ctx.ellipse(fx + 9 * sq, hy - 2, 2.8 * sq + 0.7, 3.4, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = hair; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx - 15 * sq, hy - 12); ctx.lineTo(fx - 4 * sq, hy - 9); ctx.moveTo(fx + 15 * sq, hy - 12); ctx.lineTo(fx + 4 * sq, hy - 9); ctx.stroke();
    ctx.strokeStyle = '#8a4b3c'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(fx - 5 * sq, hy + 12); ctx.lineTo(fx + 5 * sq, hy + 11); ctx.stroke();
    ctx.restore();
  }
  // ense saçı: kafa döndükçe kavisli kenarla yana kayar
  ctx.save(); ctx.beginPath(); ctx.arc(0, hy, hr, 0, 7); ctx.clip();
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(-turn * hr * 1.9, hy + 2, hr + 3, 0, 7); ctx.fill();
  ctx.restore();
  fillShape(() => { ctx.arc(0, hy - 3, hr + 2, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); }, hair, o);
  ctx.restore();
}

function warnMark(x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,201,77,.35)'; ctx.beginPath(); ctx.arc(0, 0, 70, 0, 7); ctx.fill();
  fillShape(C(0, 0, 50), '#ffc94d', { ow: 1.2 });
  ctx.fillStyle = INK; ctx.font = `900 74px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', 0, 4);
  ctx.strokeStyle = '#ffc94d'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (const a of [-2.5, -1.9, -1.25, -0.65]) { ctx.beginPath(); ctx.moveTo(Math.cos(a) * 66, Math.sin(a) * 66); ctx.lineTo(Math.cos(a) * 92, Math.sin(a) * 92); ctx.stroke(); }
  ctx.restore();
}

/* ---------- cam bölme ---------- */
function drawGlass() {
  ctx.fillStyle = 'rgba(160,210,240,.10)'; ctx.fillRect(0, 0, W, 740);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(0, 468, W, 34);
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  for (const x0 of [180, 900, 1450]) { ctx.beginPath(); ctx.moveTo(x0, 740); ctx.lineTo(x0 + 70, 740); ctx.lineTo(x0 + 290, 0); ctx.lineTo(x0 + 220, 0); ctx.fill(); }
  for (const x of [540, 1180, 1820]) { ctx.fillStyle = '#7f8ca3'; ctx.fillRect(x, 0, 16, 740); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + 3, 0, 3, 740); }
  ctx.fillStyle = '#58637c'; ctx.fillRect(0, 728, W, 30);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, 728, W, 4);
}

/* ---------- ön plan ---------- */
function drawFloor() {
  ctx.fillStyle = lg(0, 758, 0, H, [[0, '#4a5672'], [1, '#2f3750']]); ctx.fillRect(0, 758, W, H - 758);
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 2;
  for (let y = 790; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // pencere ışığı
  ctx.fillStyle = 'rgba(255,200,140,.10)';
  ctx.beginPath(); ctx.moveTo(40, 758); ctx.lineTo(500, 758); ctx.lineTo(860, H); ctx.lineTo(220, H); ctx.fill();
}
function drawColleagueDesk() {
  // sol: boş iş arkadaşı masası (derinlik için koyu)
  fillShape(R(-20, 690, 420, 210, 0), 'rgba(0,0,0,0)', { outline: false });
  fillShape(R(110, 640, 230, 160, 12), '#262b3b');
  fillShape(R(205, 800, 40, 70, 4), '#1d2130');
  fillShape(R(-30, 860, 520, 40, 6), '#b9814f'); ctx.fillStyle = '#9b6a40'; ctx.fillRect(-30, 900, 520, 200);
  fillShape(R(360, 800, 44, 60, 8), '#4fd1a5');
  // sağ: yazıcı + büyük bitki

  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.translate(1880, 880); ctx.rotate(-Math.PI / 2 - 0.5 + (i - 2.5) * 0.3);
    fillShape(E(90, 0, 100, 26), i % 2 ? '#2f7d58' : '#3f9d6e'); ctx.restore();
  }
}
function drawPlayer(cx, deskY, k, holding) {
  ctx.save(); ctx.translate(cx, deskY); ctx.scale(k, k);
  const o = { scale: k };
  // sandalye
  const chair = R(-70, -170, 140, 180, 30); fillShape(chair, '#2a3047', o);
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(-58, -160, 18, 150);
  // gövde (kazak)
  const body = R(-62, -100, 124, 120, 34); fillShape(body, '#2fb3a6', o); shadeRight(body, 18, 0.18);
  fillShape(() => { ctx.moveTo(-18, -100); ctx.lineTo(0, -80); ctx.lineTo(18, -100); ctx.closePath(); }, '#258f85', o);
  ctx.fillStyle = '#d9a07a'; ctx.fillRect(-10, -116, 20, 18);
  // kafa
  const hy = -150, hr = 38;
  fillShape(C(-hr + 2, hy + 4, 8), '#e9b48c', o); fillShape(C(hr - 2, hy + 4, 8), '#e9b48c', o);
  const head = C(0, hy, hr); fillShape(head, '#efbf96', o); shadeRight(head, 14, 0.1);
  // ekran ışığı
  if (holding) {
    ctx.save(); ctx.beginPath(); ctx.arc(0, hy, hr, 0, 7); ctx.clip();
    ctx.fillStyle = lg(-hr, hy + hr, hr, hy - hr, [[0, 'rgba(255,80,200,.35)'], [0.5, 'rgba(80,200,255,.25)'], [1, 'rgba(255,255,255,0)']]);
    ctx.fillRect(-hr, hy - hr, hr * 2, hr * 2); ctx.restore();
  }
  // saç
  fillShape(() => { ctx.arc(0, hy - 4, hr + 3, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(10, hy - 26, -30, hy - 14); ctx.closePath(); }, '#3b2620', o);
  fillShape(E(-14, hy - 36, 22, 12, -0.3), '#4a3027', o);
  // yüz: gergin sırıtma
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(-13, hy + 2, 4.6, 6.2, 0, 0, 7); ctx.ellipse(13, hy + 2, 4.6, 6.2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-11.5, hy, 1.8, 0, 7); ctx.arc(14.5, hy, 1.8, 0, 7); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-21, hy - 12); ctx.lineTo(-7, hy - 15); ctx.moveTo(21, hy - 12); ctx.lineTo(7, hy - 15); ctx.stroke();
  fillShape(() => { ctx.moveTo(-14, hy + 17); ctx.quadraticCurveTo(0, hy + 30, 14, hy + 17); ctx.closePath(); }, '#fff', o);
  // ter
  fillShape(() => { ctx.moveTo(33, hy - 22); ctx.quadraticCurveTo(41, hy - 6, 33, hy - 2); ctx.quadraticCurveTo(25, hy - 6, 33, hy - 22); }, '#8fd6ff', o);
  ctx.restore();
}
function drawDeskAndLaptop(cx, deskY, k, holding) {
  // laptop (sırtı bize dönük)
  ctx.save(); ctx.translate(cx, deskY); ctx.scale(k, k);
  const o = { scale: k };
  if (holding) {
    ctx.fillStyle = rg(0, -40, 40, 170, [[0, 'rgba(255,90,210,.0)'], [0.6, 'rgba(120,200,255,.25)'], [1, 'rgba(120,200,255,0)']]);
    ctx.fillRect(-180, -200, 360, 260);
  }
  const lid = R(-86, -84, 172, 104, 12);
  fillShape(lid, lg(0, -84, 0, 20, [[0, '#eef1f6'], [1, '#c9cfdb']]), o);
  fillShape(C(-34, -46, 14), '#ffc94d', o);
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-39, -49, 2, 0, 7); ctx.arc(-29, -49, 2, 0, 7); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(-34, -44, 6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  fillShape(R(10, -36, 46, 18, 5), '#7bdff2', o);
  fillShape(() => { ctx.moveTo(30, -70); ctx.lineTo(36, -58); ctx.lineTo(49, -58); ctx.lineTo(39, -50); ctx.lineTo(43, -38); ctx.lineTo(30, -46); ctx.lineTo(17, -38); ctx.lineTo(21, -50); ctx.lineTo(11, -58); ctx.lineTo(24, -58); ctx.closePath(); }, '#ff6b5e', o);
  ctx.restore();
  // masa
  const dx = cx - 380;
  fillShape(R(dx, deskY + 20 * k, 760, 44, 8), '#e0a372');
  ctx.fillStyle = lg(0, deskY + 60, 0, H, [[0, '#b97c4d'], [1, '#93603c']]); ctx.fillRect(dx, deskY + 20 * k + 40, 760, 300);
  ctx.save(); ctx.translate(cx - 960, 0);
  // kupa
  fillShape(R(650, deskY - 40, 64, 78, 10), '#ff6b5e');
  ctx.strokeStyle = S.outline ? INK : '#ff6b5e'; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(718, deskY - 2, 18, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.moveTo(670 + i * 24, deskY - 52); ctx.quadraticCurveTo(660 + i * 24, deskY - 80, 676 + i * 24, deskY - 104); ctx.stroke(); }
  // evrak
  for (let i = 0; i < 5; i++) fillShape(R(1180 + (i % 2) * 6, deskY + 10 - i * 12, 110, 14, 2), i === 4 ? '#ffe9a8' : '#f6f6f2');
  ctx.restore();
}

/* ---------- HUD (her stilde tam çözünürlük) ---------- */
function panel(x, y, w, h, r = 22) {
  octx.save();
  octx.fillStyle = 'rgba(14,17,28,.78)'; octx.beginPath(); rrO(x, y, w, h, r); octx.fill();
  octx.strokeStyle = 'rgba(255,255,255,.12)'; octx.lineWidth = 2; octx.stroke();
  octx.restore();
}
function rrO(x, y, w, h, r) { octx.moveTo(x + r, y); octx.arcTo(x + w, y, x + w, y + h, r); octx.arcTo(x + w, y + h, x, y + h, r); octx.arcTo(x, y + h, x, y, r); octx.arcTo(x, y, x + w, y, r); octx.closePath(); }
function txt(s, x, y, size, color, weight = 800, align = 'left', spacing = 0) {
  const f = STYLE_NAME === 'pixel' ? `bold ${size}px "Courier New", monospace` : `${weight} ${size}px ${FONT}`;
  octx.font = f; octx.fillStyle = color; octx.textAlign = align; octx.textBaseline = 'alphabetic';
  if ('letterSpacing' in octx) octx.letterSpacing = spacing + 'px';
  octx.fillText(s, x, y);
  if ('letterSpacing' in octx) octx.letterSpacing = '0px';
}
function heartO(x, y, s, fill) {
  octx.fillStyle = fill; octx.beginPath();
  octx.moveTo(x, y + s * 0.3);
  octx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  octx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.75, x, y + s);
  octx.bezierCurveTo(x, y + s * 0.75, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  octx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3); octx.fill();
}
function drawHUD() {
  // kasa
  panel(36, 30, 330, 120);
  txt('KASA', 64, 74, 22, '#8c95ad', 800, 'left', 4);
  txt('1.284', 64, 132, 60, '#ffc94d', 900);
  // saat + gün çubuğu
  panel(760, 30, 400, 120);
  txt('15:20', 960, 104, 62, '#6ff0c0', 900, 'center');

/* ---------- pixel stil: palete oturt ---------- */
function quantize() {
  const PAL = ['#1b1f2e', '#2a3047', '#3a4054', '#4a5672', '#58637c', '#7f8ca3', '#c9cfdb', '#eef1f6', '#fffdf8', '#f1e3cf', '#e2cdb3', '#d6bf9f', '#c3a985', '#cdb898',
    '#a8714a', '#93603c', '#e0a372', '#b97c4d', '#3a5a8c', '#263c63', '#2c466f', '#f2c6a0', '#d9a983', '#efbf96', '#3a2a22', '#3b2620', '#2fb3a6', '#258f85',
    '#ff6b5e', '#d96c5f', '#ffc94d', '#4fd1a5', '#3f9d6e', '#2f7d58', '#7fb4e6', '#f7c59f', '#f49d7a', '#7d6f9a', '#5e537c', '#8fd6ff', '#ff4d5e', '#dfe7f1'].map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  const img = ctx.getImageData(0, 0, sc.width, sc.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    let best = 0, bd = 1e9;
    for (let p = 0; p < PAL.length; p++) { const a = d[i] - PAL[p][0], b = d[i + 1] - PAL[p][1], c = d[i + 2] - PAL[p][2]; const dd = a * a * 0.3 + b * b * 0.59 + c * c * 0.11; if (dd < bd) { bd = dd; best = p; } }
    d[i] = PAL[best][0]; d[i + 1] = PAL[best][1]; d[i + 2] = PAL[best][2]; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
