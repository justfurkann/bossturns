# Windows .exe derlemesi. Oyunun kaynağı yine tek dosya: index.html.
# - main'e oyunla ilgili bir push gelince ya da elle çalıştırınca: exe, "Artifacts" bölümünden indirilebilir.
# - v* etiketi atılınca (ör. v0.1.0): exe'ler GitHub Releases sayfasına konur.
name: Masaüstü (Windows exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'index.html'
      - 'src-tauri/**'
      - 'tools/build-dist.js'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Oyun mantığı testi (denge simülasyonu çalışıyor mu)
        run: node tools/sim.js 200

      - name: Exe derle
        run: npx --yes @tauri-apps/cli@2.12.4 build

      - name: Dosyaları topla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/boss-turns.exe "out/BOSS-TURNS-tasinabilir.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BOSS-TURNS-windows
          path: out/*.exe

      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          body: |
            **BOSS-TURNS-tasinabilir.exe**: kurulumsuz; çift tıkla ve oyna.
            **…-setup.exe**: kurulumlu sürüm. Başlat menüsüne ekler, yönetici izni istemez.

            Patron tuşu: **Ctrl+Shift+Boşluk**. Oyun odakta olmasa bile pencereyi anında gizler, tekrar basınca geri getirir.
            İmzasız olduğu için Windows "Bilgisayarınız korundu" diyebilir: "Ek bilgi" → "Yine de çalıştır".
